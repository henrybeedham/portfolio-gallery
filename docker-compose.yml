services:
  gallery:
    build: .
    image: client-gallery:latest
    # Not "client-gallery": that name is used by the previous version of the app.
    container_name: gallery
    restart: unless-stopped
    ports:
      # Set GALLERY_BIND=127.0.0.1 when a reverse proxy on this host is the only way in.
      - '${GALLERY_BIND:-0.0.0.0}:${GALLERY_PORT:-3000}:3000'
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
    volumes:
      # Database, original photos, generated thumbnails and the hero image.
      - ./data:/data
      # Drop images here (or in a sub-folder named after an album's slug) to import them.
      - ./import:/data/import
