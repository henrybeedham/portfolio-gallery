services:
  gallery:
    # The published image is pulled by default. To build from this checkout instead, run
    # `docker compose up -d --build`.
    image: ghcr.io/henrybeedham/portfolio-gallery:latest
    build: .
    # Not "client-gallery": that name is used by the previous version of the app.
    container_name: gallery
    restart: unless-stopped
    # No port is published: Coolify's proxy (or another reverse proxy on the same Docker network)
    # routes to port 3000, so visitors can only come in through it. To reach the app directly,
    # on your LAN for example, add:
    #   ports:
    #     - '3000:3000'
    expose:
      - '3000'
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
    volumes:
      # Database, original photos, generated thumbnails and the hero image.
      - ./data:/data
      # Drop images here (or in a sub-folder named after an album's slug) to import them.
      - ./import:/data/import
